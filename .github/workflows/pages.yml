name: pages

# The website (site/) on GitHub Pages: https://phantomptr.github.io/ps5upload/
#
# The page reads GitHub's releases API live in the visitor's browser, so a new release shows
# up without a deploy. Each deploy also writes site/releases.json, the copy the page falls
# back on when the API can't be reached (offline, or GitHub's anonymous rate limit).
#
# When it deploys:
# - a change to site/ (or this file) on main;
# - after the publish workflow finishes. A release made by publish.yml does not fire the
#   `release` event below: GitHub doesn't start workflows from its own token's actions;
# - a release published, edited or deleted by hand (promoting a pre-release is an edit);
# - once a day, so the snapshot never drifts far;
# - by hand (Actions → pages → Run workflow).

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site-releases.mjs", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [publish]
    types: [completed]
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Snapshot the releases (fallback for the page)
        run: node scripts/site-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
